# Contrato da API do SIGAPE: rotas, o que entra, o que sai e quais erros existem.
# O front (Lara) monta os mocks a partir deste arquivo.

openapi: 3.0.3
info:
  title: SIGAPE API
  version: 0.1.0
servers:
  - url: http://localhost:3000

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o servidor por matrícula e senha (RF01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matricula, senha]
              properties:
                matricula:
                  type: string
                  example: "12345"
                senha:
                  type: string
                  format: password
      responses:
        "200":
          description: Login realizado. O cookie de sessão HttpOnly (sigape_token) é definido na resposta.
          headers:
            Set-Cookie:
              description: Cookie de sessão (HttpOnly, Secure, SameSite). Expira após 30 min de inatividade.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: "#/components/schemas/Usuario"
        "400":
          description: Requisição inválida. O corpo não contém matrícula ou senha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "401":
          description: Matrícula ou senha inválidos, ou acesso temporariamente bloqueado (5 falhas seguidas, 15 min). A resposta é a mesma nos dois casos, de propósito (RNF08).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário da sessão atual
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sessão válida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: "#/components/schemas/Usuario"
        "401":
          description: Sessão ausente ou expirada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão e invalida o cookie (RNF09)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Sessão encerrada. Resposta sem corpo.
        "401":
          description: Sessão ausente ou expirada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sigape_token
  schemas:
    Erro:
      type: object
      properties:
        mensagem:
          type: string
          example: "Matrícula ou senha inválidos."
    Usuario:
      type: object
      properties:
        id_usuario: { type: integer }
        nome: { type: string }
        perfil:
          type: string
          enum: [servidor_comum, operador_setor, gestor_setor, admin_sistema]
        setor: { type: string, example: RH }
# contrato da API do SIGAPE: rotas, o que entra, o que sai e quais erros existem
# o front monta os mocks a partir deste arquivo

openapi: 3.0.3
info:
  title: SIGAPE API
  version: 0.1.0
servers:
  - url: http://localhost:3000

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o servidor por matrícula e senha (RF01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matricula, senha]
              properties:
                matricula:
                  type: string
                  example: "12345"
                senha:
                  type: string
                  format: password
      responses:
        "200":
          description: Login realizado. O cookie de sessão HttpOnly é definido na resposta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    type: object
                    properties:
                      id_usuario: { type: integer }
                      nome: { type: string }
                      perfil:
                        type: string
                        enum: [servidor_comum, operador_setor, gestor_setor, admin_sistema]
                      setor: { type: string, example: RH }
        "400":
          description: Requisição inválida. O corpo não contém matrícula ou senha.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: "Matrícula e senha são obrigatórias."
        "401":
          description: Matrícula ou senha inválidos, ou acesso temporariamente bloqueado (5 falhas seguidas, 15 min). A resposta é a mesma nos dois casos, de propósito (RNF08).
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: "Matrícula ou senha inválidos."